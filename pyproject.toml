[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "goofish-mcp"
version = "0.6.3"
description = "闲鱼 CLI — 支持 MCP，未来支持 Claude Skills。为 AI Agent 提供闲鱼自动化基础能力。"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "fancy", email = "saral96@mail.com" }]
keywords = ["xianyu", "goofish", "cli", "mcp", "ai-agent", "automation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
  "requests>=2.31",
  "loguru>=0.7",
  "typer>=0.12",
  "pydantic>=2.6",
  "pyexecjs>=1.5",
  "rich>=13.7",
  "pyyaml>=6.0",
  "tenacity>=8.2",
  # v2 renames FastMCP to MCPServer and requires a server migration.
  # Keep the existing FastMCP implementation on the maintained v1 line for now.
  "mcp>=1.26,<2",
  "uvicorn>=0.30",
  "websockets>=13",
  "browser-cookie3>=0.20",
  "playwright>=1.58.0",
  "cryptography>=41.0",
  "filelock>=3.16,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.4",
  "mypy>=1.10",
]

[project.scripts]
goofish = "goofish_mcp.cli:app"
goofish-mcp = "goofish_mcp.cli:app"

[project.urls]
Homepage = "https://github.com/Oasis1i/goofish-mcp"
Repository = "https://github.com/Oasis1i/goofish-mcp"
Issues = "https://github.com/Oasis1i/goofish-mcp/issues"
Changelog = "https://github.com/Oasis1i/goofish-mcp/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/goofish_mcp"]

# 内置 Claude Skills：把项目根 `skills/` 收进 wheel 的 `goofish_mcp/_bundled_skills/`，
# 让 `goofish skills install` 能按包内路径定位到它（当前实现用 `goofish_mcp.__file__`
# 拼子路径，不依赖 importlib.resources，避免 namespace package 在不同 py 版本上的行为差异）。
[tool.hatch.build.targets.wheel.force-include]
"skills" = "src/goofish_mcp/_bundled_skills"

[tool.hatch.build.targets.sdist]
include = [
  "src/",
  "skills/",
  ".claude-plugin/",
  "README.md",
  "CHANGELOG.md",
  "LICENSE",
  "NOTICE",
  "pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
